<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>多线程下载</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup"><header><span class="logo">↓</span><div><h1>多线程下载</h1><p>使用 Chrome 网络</p></div><label><input type="checkbox" id="enabled">自动接管</label></header>
<section class="settings"><label>并发 <select id="connections"><option>4</option><option>8</option><option>16</option><option>32</option><option>64</option></select></label><label>外观 <select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label></section>
<section class="folder"><span id="directory">未选择保存文件夹</span><button id="options">选择文件夹</button></section>
<p id="notice" role="status"></p><main id="tasks" aria-live="polite"></main>
<footer>点击下载后会立即提示。任务完成后自动清理列表。<br>接管期间 Chrome 原任务暂停，可在此处切回。<br><span id="version"></span></footer>
<script type="module" src="popup.js"></script></body></html>
