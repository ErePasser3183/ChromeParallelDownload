<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>设置下载文件夹</title><link rel="stylesheet" href="ui.css"></head>
<body class="options"><header><span class="logo">↓</span><div><h1>下载，少等一步</h1><p>多线程下载</p></div></header>
<main><h2>先选择保存文件夹</h2><p>Chrome 需要你点击授权一次。文件会直接写入所选文件夹，支持大文件，不需要安装其他程序。</p><p>若浏览器询问，允许查看和修改所选文件夹。</p><button class="primary" id="choose">选择下载文件夹</button><p id="status" role="status">正在检查…</p>
<p>之后像平常一样点击网页下载，或右键链接选择“使用多线程下载”。需要登录、表单或网站生成的文件继续交给 Chrome。</p>
<p>同时只开启一个下载接管扩展。启用本版前，请先关闭旧版的“自动接管”。</p><p>关闭弹出面板不影响下载。完全退出 Chrome 会中断纯扩展任务；重开后会尝试恢复 Chrome 原下载，右键发起的任务需重新开始。</p></main>
<script type="module" src="options.js"></script></body></html>
